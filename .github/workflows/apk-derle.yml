name: APK derle

# GitHub'a yüklediğinde (ya da Actions sekmesinden "Run workflow" ile) APK'yı ücretsiz olarak derler.
on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: İmza anahtarını Secrets'tan hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret'i tanımlı değil. Settings > Secrets and variables > Actions bölümüne ekleyin (README'ye bakın)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Kurulabilir APK'yı derle (release, imzalı)
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: APK'yı sakla
        uses: actions/upload-artifact@v4
        with:
          name: Dogum-Gunu-Asistanim-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: APK'yı Release olarak yayımla (indirme bağlantısı)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk Dogum-Gunu-Asistanim.apk
          gh release create "v1.0.${{ github.run_number }}" Dogum-Gunu-Asistanim.apk \
            --title "Doğum Günü Asistanım v1.0.${{ github.run_number }}" \
            --notes "Telefona kurulabilir APK. Kurulum için README.md'ye bakın."

      # Birim testleri APK'dan sonra çalışır; bir test hata verse bile APK ve Release hazır olur.
      - name: Birim testleri (tarih ve bildirim hesapları)
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Test raporunu sakla
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-raporu
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
